<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lives — Fluência Contábil</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<!-- As 4 lives gratuitas de 04 a 07/08/2026 já aconteceram. A página saiu do ar em
     19/08/2026, mas a URL foi mantida viva: ela ainda circula em e-mails enviados,
     na bio do Instagram e na descrição de vídeos do YouTube. Apagar o arquivo
     transformaria tudo isso em 404. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://fluenciacontabil.com.br/cursos.html">
<meta http-equiv="refresh" content="2; url=cursos.html#assinar">
<!-- A bio do Instagram e descrições antigas apontam para cá. A query string
     (utm_*) segue junto: sem isso o tráfego da bio chega em cursos.html sem
     origem e a venda entra no Gestão como orgânica. O refresh de 2 s é só o
     fallback sem JS, e ele perde os parâmetros. -->
<script>window.location.replace('cursos.html' + window.location.search + '#assinar');</script>
<style>
  body{margin:0;background:#1B2A4A;color:#fff;font-family:'Montserrat',Arial,Helvetica,sans-serif;
       display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;}
  .box{max-width:520px;}
  .marca{font-size:22px;font-weight:900;letter-spacing:.5px;margin-bottom:24px;}
  .marca span{color:#C8A84B;}
  h1{font-size:24px;line-height:1.3;margin:0 0 14px;}
  p{font-size:15px;line-height:1.7;color:rgba(255,255,255,.75);margin:0 0 26px;}
  a.btn{display:inline-block;padding:14px 26px;background:#C8A84B;color:#1B2A4A;
        text-decoration:none;border-radius:3px;font-size:12px;font-weight:800;
        letter-spacing:1.2px;text-transform:uppercase;}
</style>
</head>
<body>
  <div class="box">
    <div class="marca">FLUÊNCIA <span>CONTÁBIL</span></div>
    <h1>As lives gratuitas já aconteceram.</h1>
    <p>Estamos te levando para a página do curso. Se não for automático, é só clicar abaixo.</p>
    <a class="btn" href="cursos.html#assinar">Conhecer o curso</a>
  </div>
</body>
</html>
